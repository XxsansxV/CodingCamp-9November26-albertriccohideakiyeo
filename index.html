<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Expense & budget visualizer</title>
		<link rel="stylesheet" href="./css/style.css">
		<script defer src="https://cdnjs.com/libraries/Chart.js"></script>
		<script defer src="./js/app.js"></script>
	</head>
	<body>
		<header class="app-header">
			<h1>Expense & Budget Visualizer</h1>
			<button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
		</header>
		<main class="app-main">
			<section id="balance-section">
				<h2>Total Balance</h2>
				<p id="balance-display">Rp0</p>
			</section>
			<section id="form-section">
				<h2>Add Transaction</h2>
				<form id="transaction-form" novalidate>
					<label for="item-name">Item Name</label>
					<input id="item-name" class="field" type="text" maxlength="100">
					<p id="item-name-error" class="field-error"></p>
					<label for="amount">Amount (Rp)</label>
					<input id="amount" class="field" type="number" min="0.01" max="9999999999.99" step="0.01">
					<p id="amount-error" class="field-error"></p>
					<label for="category">Category</label>
					<select id="category" class="field"></select>
					<p id="category-error" class="field-error"></p>
					<button type="submit">Add Transaction</button>
				</form>
				<p id="form-error" class="error-message" role="alert"></p>
			</section>
			<section id="chart-section">
				<h2>Spending by Category</h2>
				<div class="chart-wrapper">
					<canvas id="pie-chart"></canvas>
				</div>
				<p id="chart-empty" class="chart-empty hidden">No data available</p>
			</section>
			<section id="sort-section">
				<label for="sort-select">Sort by</label>
				<select id="sort-select">
					<option value="newest">Newest First</option>
					<option value="oldest">Oldest First</option>
					<option value="highest">Highest Amount</option>
					<option value="lowest">Lowest Amount</option>
					<option value="category-asc">By Category (A-Z)</option>
					<option value="category-desc">By Category (Z-A)</option>
				</select>
			</section>
			<section id="list-section">
				<h2>Transactions</h2>
				<ul id="transaction-list" class="scrollable"></ul>
				<p id="list-empty" class="empty-state hidden">No transactions yet</p>
			</section>
			<section id="summary-section">
				<h2>Monthly Summary</h2>
				<div id="monthly-summary"></div>
			</section>
			<section id="settings-section">
				<h2>Settings</h2>
				<div id="category-settings"></div>
				<div id="limit-settings"></div>
			</section>
		</main>
	</body>
</html>
